[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-intraday-ai"
version = "0.1.0"
description = "Indian stock market algorithmic trading platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pytest",
    "ruff",
    "streamlit"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
